name: Build and Upload

on:
  workflow_dispatch:

# ==================== 常量配置（统一在此维护） ====================
env:
  # 腾讯云 COS 桶与地域（非机密；机密仅需配置 secrets.TENCENT_SECRET_ID / TENCENT_SECRET_KEY）
  COS_BUCKET: ocs-1301696006
  COS_REGION: ap-guangzhou
  # COS 目标目录（fork 验证统一使用 /app/test/ 前缀；生产为 /app/，合回上游前需还原）
  COS_DOWNLOAD_DIR: /app/test/download/
  COS_UPDATER_DIR: /app/test/electron-updater/
  # coscmd 上传调优参数（已对照 coscmd config -h 核实）：
  #   COS_THREAD_NUM  并发线程数：runner→广州为跨境慢链路（实测 60-250kB/s），
  #                   线程越少单流带宽越高，取 3
  #   COS_PART_SIZE   分片大小 MB：慢链路下 16MB 单片需 2-4 分钟，超 COS 服务端容忍度
  #                   被 UserNetworkTooSlow 踢断；4MB 单片约 30 秒完成，规避踢断
  #   COS_RETRY       单个分片失败重试次数
  #   COS_TIMEOUT     单请求超时秒数（注意：-t 是 token 参数，不是超时；--connect-timeout 不存在）
  COS_THREAD_NUM: "3"
  COS_PART_SIZE: "4"
  COS_RETRY: "10"
  COS_TIMEOUT: "600"

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            platform: win
            arch: x64

          # macOS x64 (Intel Mac runner 原生构建)
          - os: macos-15-intel
            platform: mac
            arch: x64

          # macOS ARM64
          - os: macos-latest
            platform: mac
            arch: arm64

          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PLATFORM=${{ matrix.platform }}" >> $GITHUB_ENV
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
        shell: bash

      - name: Build
        run: pnpm build
        env:
          USE_HARD_LINKS: false
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          # 产物目录已迁移至仓库根 releases/（electron.builder.json directories.output）
          path: |
            releases/*.exe
            releases/*.blockmap
            releases/*.dmg
            releases/*.AppImage
            releases/*.deb
            releases/*.rpm
            releases/latest*.yml
          if-no-files-found: ignore
          retention-days: 3

  upload-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          BUILDTIME=$(TZ=Asia/Shanghai date)
          echo "BUILDTIME=$BUILDTIME" >> $GITHUB_ENV
        shell: bash

      - name: Create Release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" --draft --generate-notes || true

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Uploading artifacts to release: $TAG_NAME"
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG_NAME" "$file" --clobber || echo "Failed to upload $file"
            fi
          done

      - name: Append custom release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXISTING_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || echo "")
          DL="${{ env.DOWNLOAD_URL }}"
          VER="${{ env.VERSION }}"
          BT="${{ env.BUILDTIME }}"
          CUSTOM_NOTES="
          ---
          ## 📦 下载地址
          ### Windows (不支持Win7)
          - [64位安装包](${DL}ocs-${VER}-setup-win-x64.exe)
          ### macOS
          - [M系列芯片(ARM64)](${DL}ocs-${VER}-setup-mac-arm64.dmg) | [Intel芯片(x64)](${DL}ocs-${VER}-setup-mac-x64.dmg)
          ### Linux
          - [AppImage](${DL}ocs-${VER}-setup-linux-x64.AppImage)
          ### 🔗 快捷访问
          - [官网](https://docs.ocsjs.com/)
          - [官网软件下载（更快）](https://docs.ocsjs.com/docs/app)
          > Created at ${BT}."
          gh release edit "$TAG_NAME" --notes "${EXISTING_BODY}${CUSTOM_NOTES}"

  upload-cos:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 腾讯云 COS 上传 — 仅需配置 secrets.TENCENT_SECRET_ID / TENCENT_SECRET_KEY
    # 如果是 fork 仓库没有密钥，此 job 会自动跳过
    continue-on-error: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping COS upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -r "$COS_REGION" \
            -m "$COS_THREAD_NUM" \
            -p "$COS_PART_SIZE" \
            --retry "$COS_RETRY" \
            --timeout "$COS_TIMEOUT"

      # 逐文件上传 + 调用级重试：
      # coscmd upload 默认开启分片断点续传（-f/--force 才是关闭断点），
      # 因此重试同一文件时会从中断的分片继续，而非整个文件重传；
      # 逐文件循环保证单个文件失败不影响其他文件，且重试粒度更小
      - name: Upload to Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "${COS_DOWNLOAD_DIR}${{ env.VERSION }}/"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

  # 更新日志源文件上传：客户端检测到新版本后，会从更新目录拉取 CHANGELOG.md，
  # 按当前版本与最新版本的区间自行截取日志并以 markdown 展示，无需维护 infos.json。
  upload-changelog:
    needs: upload-cos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping changelog upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

      - name: Upload CHANGELOG.md to COS
        if: steps.check-secrets.outputs.available == 'true'
        run: coscmd upload -y CHANGELOG.md "$COS_UPDATER_DIR"

  # 安装包 + blockmap 上传到固定更新目录（不含 latest*.yml）。
  # 客户端只轮询 latest.yml 判断更新，仅传安装包不会触发任何更新提示；
  # latest.yml 由最后的 publish-update job 经人工审批后才上传。
  upload-electron-updater:
    needs: upload-changelog
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping electron-updater upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -r "$COS_REGION" \
            -m "$COS_THREAD_NUM" \
            -p "$COS_PART_SIZE" \
            --retry "$COS_RETRY" \
            --timeout "$COS_TIMEOUT"

      - name: Upload electron-updater files to COS
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in artifacts/*.blockmap artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "$COS_UPDATER_DIR"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

  # 发布闸门：仅上传 latest*.yml。客户端只依据 latest.yml 判断是否有新版本，
  # 本 job 执行前更新对用户完全不可见（安装包已就位但无版本指向）。
  # 通过 GitHub Environment 实现人工审批：仓库 Settings → Environments 新建
  # publish-update 环境并勾选 Required reviewers，流水线会停在本 job 等待
  # Approve（上传 latest.yml，更新生效）或 Reject（本次更新不发布）。
  publish-update:
    needs: upload-electron-updater
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: publish-update

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping latest.yml upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

      - name: Upload latest.yml to COS
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in artifacts/latest*.yml; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "$COS_UPDATER_DIR"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done
