          if-no-files-found: ignore
          retention-days: 3

  upload-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          BUILDTIME=$(TZ=Asia/Shanghai date)
          echo "BUILDTIME=$BUILDTIME" >> $GITHUB_ENV
        shell: bash

      - name: Create Release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" --draft --generate-notes || true

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Uploading artifacts to release: $TAG_NAME"
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG_NAME" "$file" --clobber || echo "Failed to upload $file"
            fi
          done

      - name: Append custom release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXISTING_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || echo "")
          DL="${{ env.DOWNLOAD_URL }}"
          VER="${{ env.VERSION }}"
          BT="${{ env.BUILDTIME }}"
          CUSTOM_NOTES="
          ---
          ## 📦 下载地址
          ### Windows (不支持Win7)
          - [64位安装包](${DL}ocs-${VER}-setup-win-x64.exe)
          ### macOS
          - [M系列芯片(ARM64)](${DL}ocs-${VER}-setup-mac-arm64.dmg) | [Intel芯片(x64)](${DL}ocs-${VER}-setup-mac-x64.dmg)
          ### Linux
          - [AppImage](${DL}ocs-${VER}-setup-linux-x64.AppImage)
          ### 🔗 快捷访问
          - [官网](https://docs.ocsjs.com/)
          - [官网软件下载（更快）](https://docs.ocsjs.com/docs/app)
          > Created at ${BT}."
          gh release edit "$TAG_NAME" --notes "${EXISTING_BODY}${CUSTOM_NOTES}"

  upload-cos:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 腾讯云 COS 上传 — 需要配置 secrets
    # 如果是 fork 仓库没有密钥，此 job 会自动跳过
    continue-on-error: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping COS upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      # coscmd 参数（已对照 coscmd config -h 核实）：
      #   -m        并发线程数：单文件分片并发，取 ≈分片数即可（200MB/16MB≈13 片）；
      #             国际链路上过高并发会加剧拥塞反而降低成功率，runner 为 4 vCPU，取 10
      #   -p        分片大小 MB（默认仅 1MB：200MB 文件会切 200 片，慢且易失败，调大到 16MB）
      #   --retry   单个分片失败重试次数
      #   --timeout 单请求超时秒数（注意：-t 是 token 参数，不是超时；--connect-timeout 不存在）
      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b ${{ secrets.COS_BUCKET }} \
            -r ${{ secrets.COS_REGION }} \
            -m 10 \
            -p 16 \
            --retry 10 \
            --timeout 600

      # 逐文件上传 + 调用级重试：
      # coscmd upload 默认开启分片断点续传（-f/--force 才是关闭断点），
      # 因此重试同一文件时会从中断的分片继续，而非整个文件重传；
      # 逐文件循环保证单个文件失败不影响其他文件，且重试粒度更小
      - name: Upload to Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "/app/download/${{ env.VERSION }}/"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

  # 更新日志源文件上传：客户端检测到新版本后，会从更新目录拉取 CHANGELOG.md，
  # 按当前版本与最新版本的区间自行截取日志并以 markdown 展示，无需维护 infos.json。
  upload-changelog:
    needs: upload-cos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping changelog upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b ${{ secrets.COS_BUCKET }} \
            -r ${{ secrets.COS_REGION }}

      - name: Upload CHANGELOG.md to COS
        if: steps.check-secrets.outputs.available == 'true'
        run: coscmd upload -y CHANGELOG.md /app/electron-updater/

  # electron-updater 三件套（latest*.yml + 安装包 + blockmap）上传到固定更新目录。
  # 最后执行：latest.yml 一旦生效客户端即会检测到新版本，
  # 此时安装包（upload-cos）与更新日志（upload-changelog）均已就绪。
  upload-electron-updater:
    needs: upload-changelog
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check COS secrets availability
        id: check-secrets
        run: |
          if [ -n "$COS_SECRET_ID" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Skipping electron-updater upload: TENCENT_SECRET_ID not configured"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}

      - name: Install Tencent Cloud CLI
        if: steps.check-secrets.outputs.available == 'true'
        run: pip install coscmd

      - name: Configure Tencent Cloud COS
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b ${{ secrets.COS_BUCKET }} \
            -r ${{ secrets.COS_REGION }} \
            -m 10 \
            -p 16 \
            --retry 10 \
            --timeout 600

      - name: Upload electron-updater files to COS
        if: steps.check-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for file in artifacts/latest*.yml artifacts/*.blockmap artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage; do
            [ -f "$file" ] || continue
            for attempt in 1 2 3 4 5; do
              echo "Uploading $file (attempt $attempt/5)"
              if coscmd upload -y "$file" "/app/electron-updater/"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed after 5 attempts: $file"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done
